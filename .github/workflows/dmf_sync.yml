name: DMF Hydrocarbon Data Auto-Sync

on:
  schedule:
    # Run daily at 04:00 UTC (11:00 AM Bangkok Time)
    - cron: '0 4 * * *'
  # Re-run the ETL (no new downloads needed) as soon as a human-maintained master file changes
  push:
    branches: ["main"]
    paths:
      - 'field_group_mapping.xlsx'
      - 'field_group_mapping.json'
      - 'fang_production_master.xlsx'
      - 'fang_production_master.json'
      - 'master_mapping.xlsx'
      - 'sale_master_mapping.xlsx'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force re-process all historical months'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    name: Extract, Transform & Synchronize DMF Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas beautifulsoup4 requests urllib3

      - name: Execute Headless ETL Pipeline
        # First run (or force_refresh) downloads every year DMF publishes; later runs only
        # re-download the latest two years plus any month missing from data/cache/.
        timeout-minutes: 120
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          python .github/scripts/sync_dmf.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/ frontend/public/data/ output/ dmf_inventory_cache.json
          
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "[ETL] Auto-sync DMF Hydrocarbon Data - ${TIMESTAMP} [skip ci]"
            git push origin main
            echo "Successfully committed and pushed updated hydrocarbon data."
          fi
